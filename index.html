<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NetVital Messages</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #aaa;
    }

    h1 {
      text-align: center;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #aaa;
    }

    button {
      border: none;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #125aa0;
    }

    .logout {
      background: #d32f2f;
    }

    #app {
      display: none;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .message {
      background: #eee;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>NetVital</h1>

  <!-- LOGIN -->

  <div id="login">

    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

  </div>


  <!-- APP -->

  <div id="app">

    <h2>Send Scheduled Message</h2>

    <input
      type="text"
      id="message"
      placeholder="Enter message"
    >

    <input
      type="date"
      id="date"
    >

    <input
      type="time"
      id="time"
    >

    <button id="notificationBtn">
      Enable Notifications
    </button>

    <button id="addBtn">
      ➕ Add Message
    </button>

    <button
      id="logoutBtn"
      class="logout"
    >
      Logout
    </button>

    <div id="status"></div>

    <h2>Messages</h2>

    <div id="messages"></div>

  </div>

</div>


<script type="module">

/* ================================
   FIREBASE IMPORTS
================================ */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

import {
  getMessaging,
  getToken,
  onMessage
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-messaging.js";


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

  apiKey:
  "AIzaSyAEle7t2uxecqThWzbjV5RX8wEcXqnJvZM",

  authDomain:
  "netvital-ca1d1.firebaseapp.com",

  databaseURL:
  "https://netvital-ca1d1-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "netvital-ca1d1",

  storageBucket:
  "netvital-ca1d1.firebasestorage.app",

  messagingSenderId:
  "199895359034",

  appId:
  "1:199895359034:web:c997ee869b549578615f03"
};


/* ================================
   VAPID KEY
================================ */

/*
   IMPORTANT:

   Replace this with your Firebase
   Web Push public VAPID key.
*/

const VAPID_KEY =
"PASTE_YOUR_VAPID_PUBLIC_KEY_HERE";


/* ================================
   INITIALIZE FIREBASE
================================ */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const database =
getDatabase(app);

const messaging =
getMessaging(app);


/* ================================
   HTML ELEMENTS
================================ */

const login =
document.getElementById("login");

const appDiv =
document.getElementById("app");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const notificationBtn =
document.getElementById("notificationBtn");

const addBtn =
document.getElementById("addBtn");

const message =
document.getElementById("message");

const date =
document.getElementById("date");

const time =
document.getElementById("time");

const status =
document.getElementById("status");

const messages =
document.getElementById("messages");


/* ================================
   LOGIN
================================ */

loginBtn.onclick =
async function () {

  try {

    await signInWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );

    status.innerText =
      "Login successful";

  }

  catch (error) {

    console.error(error);

    status.innerText =
      "Login failed: " +
      error.message;
  }

};


/* ================================
   AUTH STATE
================================ */

onAuthStateChanged(
  auth,
  function(user) {

    if (user) {

      login.style.display =
        "none";

      appDiv.style.display =
        "block";

      status.innerText =
        "Logged in: " +
        user.email;

      loadMessages();

    }

    else {

      login.style.display =
        "block";

      appDiv.style.display =
        "none";

    }

  }
);


/* ================================
   LOGOUT
================================ */

logoutBtn.onclick =
async function () {

  await signOut(auth);

};


/* ================================
   ENABLE NOTIFICATIONS
================================ */

notificationBtn.onclick =
async function () {

  try {

    if (!("Notification" in window)) {

      status.innerText =
        "Notifications are not supported.";

      return;
    }


    const permission =
      await Notification.requestPermission();


    if (permission !== "granted") {

      status.innerText =
        "Notification permission denied.";

      return;
    }


    /*
       Register service worker
    */

    const registration =
      await navigator.serviceWorker.register(
        "./firebase-messaging-sw.js"
      );


    /*
       Get device token
    */

    const token =
      await getToken(
        messaging,
        {
          vapidKey:
            VAPID_KEY,

          serviceWorkerRegistration:
            registration
        }
      );


    if (!token) {

      status.innerText =
        "Could not get device token.";

      return;
    }


    const user =
      auth.currentUser;


    if (!user) {

      status.innerText =
        "Login first.";

      return;
    }


    /*
       Save device token
    */

    const tokenId =
      btoa(token)
      .replaceAll("/", "_")
      .replaceAll("+", "-")
      .replaceAll("=", "");


    await set(
      ref(
        database,
        "deviceTokens/" +
        tokenId
      ),
      {

        token: token,

        uid: user.uid,

        createdAt: Date.now()

      }
    );


    status.innerText =
      "✅ Notifications enabled!";

  }

  catch (error) {

    console.error(error);

    status.innerText =
      "Notification error: " +
      error.message;

  }

};


/* ================================
   ADD MESSAGE
================================ */

addBtn.onclick =
async function () {

  const user =
    auth.currentUser;


  if (!user) {

    status.innerText =
      "Login first.";

    return;
  }


  const text =
    message.value.trim();


  if (!text) {

    status.innerText =
      "Enter a message.";

    return;
  }


  if (!date.value) {

    status.innerText =
      "Select a date.";

    return;
  }


  if (!time.value) {

    status.innerText =
      "Select a time.";

    return;
  }


  /*
     Convert selected local date/time
     to Unix timestamp.
  */

  const selectedDate =
    new Date(
      date.value +
      "T" +
      time.value
    );


  const timestamp =
    selectedDate.getTime();


  if (timestamp <= Date.now()) {

    status.innerText =
      "Choose a future time.";

    return;
  }


  try {

    const newMessage =
      push(
        ref(
          database,
          "scheduledMessages"
        )
      );


    await set(
      newMessage,
      {

        text:
          text,

        timestamp:
          timestamp,

        createdBy:
          user.uid,

        createdAt:
          Date.now(),

        sent:
          false

      }
    );


    message.value = "";

    status.innerText =
      "✅ Message scheduled!";

  }

  catch (error) {

    console.error(error);

    status.innerText =
      "Error: " +
      error.message;

  }

};


/* ================================
   LOAD MESSAGES
================================ */

function loadMessages() {

  const messagesRef =
    ref(
      database,
      "scheduledMessages"
    );


  onValue(
    messagesRef,
    function(snapshot) {

      messages.innerHTML = "";

      const data =
        snapshot.val();


      if (!data) {

        messages.innerHTML =
          "<p>No messages.</p>";

        return;
      }


      Object.values(data)
      .forEach(function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "message";


        const d =
          new Date(
            item.timestamp
          );


        div.innerHTML =

          "<b>" +
          escapeHTML(item.text) +
          "</b>" +

          "<br>" +

          d.toLocaleString() +

          "<br>" +

          (
            item.sent
            ? "🔔 Sent"
            : "⏳ Scheduled"
          );


        messages.appendChild(div);

      });

    }
  );

}


/* ================================
   PROTECT MESSAGE TEXT
================================ */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* ================================
   FOREGROUND MESSAGE
================================ */

onMessage(
  messaging,
  function(payload) {

    console.log(
      "Message received:",
      payload
    );


    if (
      payload.notification
    ) {

      new Notification(
        payload.notification.title ||
        "NetVital",
        {

          body:
            payload.notification.body ||
            "New message"

        }
      );

    }

  }
);

</script>

</body>
</html>
