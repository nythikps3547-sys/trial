<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NetVital Reminders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      border: none;
      background: #1976d2;
      color: white;
    }

    button:hover {
      background: #125aa0;
    }

    .logout {
      background: #d32f2f;
    }

    .reminder {
      background: #f5f5f5;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
    }

    #app {
      display: none;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>NetVital</h1>

  <!-- LOGIN -->
  <div id="login">

    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

  </div>


  <!-- APPLICATION -->
  <div id="app">

    <h2>Add Reminder</h2>

    <input
      type="text"
      id="message"
      placeholder="Reminder message e.g. Drink water"
    >

    <label>Date</label>

    <input
      type="date"
      id="date"
    >

    <label>Time</label>

    <input
      type="time"
      id="time"
    >

    <button id="notificationBtn">
      Enable Notifications
    </button>

    <button id="addBtn">
      Add Reminder
    </button>

    <button id="logoutBtn" class="logout">
      Logout
    </button>

    <div id="status"></div>

    <h2>Your Reminders</h2>

    <div id="reminders"></div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    push,
    set,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

  import {
    getMessaging,
    getToken,
    onMessage
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-messaging.js";


  // ==============================
  // FIREBASE CONFIG
  // ==============================

  const firebaseConfig = {

    apiKey: "AIzaSyAEle7t2uxecqThWzbjV5RX8wEcXqnJvZM",

    authDomain: "netvital-ca1d1.firebaseapp.com",

    databaseURL:
      "https://netvital-ca1d1-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "netvital-ca1d1",

    storageBucket:
      "netvital-ca1d1.firebasestorage.app",

    messagingSenderId: "199895359034",

    appId:
      "1:199895359034:web:c997ee869b549578615f03"
  };


  // ==============================
  // VAPID KEY
  // ==============================

  // IMPORTANT:
  // Put your Firebase Web Push public key here.

  const VAPID_KEY = "PASTE_YOUR_VAPID_PUBLIC_KEY_HERE";


  // ==============================
  // INITIALIZE FIREBASE
  // ==============================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const database = getDatabase(app);

  const messaging = getMessaging(app);


  // ==============================
  // HTML ELEMENTS
  // ==============================

  const loginDiv =
    document.getElementById("login");

  const appDiv =
    document.getElementById("app");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const notificationBtn =
    document.getElementById("notificationBtn");

  const addBtn =
    document.getElementById("addBtn");

  const messageInput =
    document.getElementById("message");

  const dateInput =
    document.getElementById("date");

  const timeInput =
    document.getElementById("time");

  const remindersDiv =
    document.getElementById("reminders");

  const statusDiv =
    document.getElementById("status");


  // ==============================
  // LOGIN
  // ==============================

  loginBtn.addEventListener("click", async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {

      statusDiv.textContent =
        "Enter email and password.";

      return;
    }

    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      statusDiv.textContent =
        "Login successful.";

    } catch (error) {

      console.error(error);

      statusDiv.textContent =
        "Login failed: " + error.message;
    }

  });


  // ==============================
  // AUTH STATE
  // ==============================

  onAuthStateChanged(auth, async (user) => {

    if (user) {

      loginDiv.style.display = "none";

      appDiv.style.display = "block";

      statusDiv.textContent =
        "Logged in as " + user.email;

      loadReminders(user.uid);

    } else {

      loginDiv.style.display = "block";

      appDiv.style.display = "none";

    }

  });


  // ==============================
  // LOGOUT
  // ==============================

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

  });


  // ==============================
  // ENABLE NOTIFICATIONS
  // ==============================

  notificationBtn.addEventListener(
    "click",
    async () => {

      try {

        if (!("Notification" in window)) {

          statusDiv.textContent =
            "This browser does not support notifications.";

          return;
        }


        const permission =
          await Notification.requestPermission();


        if (permission !== "granted") {

          statusDiv.textContent =
            "Notification permission was not granted.";

          return;
        }


        // Register Firebase service worker

        const registration =
          await navigator.serviceWorker.register(
            "./firebase-messaging-sw.js"
          );


        // Get FCM token

        const token =
          await getToken(
            messaging,
            {
              vapidKey: VAPID_KEY,
              serviceWorkerRegistration:
                registration
            }
          );


        if (!token) {

          statusDiv.textContent =
            "Could not get notification token.";

          return;
        }


        const user = auth.currentUser;

        if (!user) {

          statusDiv.textContent =
            "Please login first.";

          return;
        }


        // Save device token

        const tokenKey =
          btoa(token)
            .replaceAll("/", "_")
            .replaceAll("+", "-")
            .replaceAll("=", "");


        await set(
          ref(
            database,
            "deviceTokens/" +
            user.uid +
            "/" +
            tokenKey
          ),
          {
            token: token,
            createdAt: Date.now()
          }
        );


        statusDiv.textContent =
          "Notifications enabled on this device.";

      } catch (error) {

        console.error(error);

        statusDiv.textContent =
          "Notification error: " + error.message;
      }

    }
  );


  // ==============================
  // ADD REMINDER
  // ==============================

  addBtn.addEventListener(
    "click",
    async () => {

      const user = auth.currentUser;

      if (!user) {

        statusDiv.textContent =
          "Please login first.";

        return;
      }


      const message =
        messageInput.value.trim();

      const date =
        dateInput.value;

      const time =
        timeInput.value;


      if (!message || !date || !time) {

        statusDiv.textContent =
          "Please enter message, date and time.";

        return;
      }


      // Convert local date/time to timestamp

      const localDate =
        new Date(
          `${date}T${time}`
        );


      const timestamp =
        localDate.getTime();


      if (timestamp <= Date.now()) {

        statusDiv.textContent =
          "Please select a future time.";

        return;
      }


      try {

        const reminderRef =
          push(
            ref(database, "reminders")
          );


        await set(
          reminderRef,
          {

            message: message,

            date: date,

            time: time,

            timestamp: timestamp,

            uid: user.uid,

            sent: false,

            createdAt: Date.now()

          }
        );


        messageInput.value = "";

        statusDiv.textContent =
          "Reminder added successfully.";

      } catch (error) {

        console.error(error);

        statusDiv.textContent =
          "Could not save reminder: " +
          error.message;
      }

    }
  );


  // ==============================
  // LOAD REMINDERS
  // ==============================

  function loadReminders(uid) {

    const remindersRef =
      ref(database, "reminders");


    onValue(
      remindersRef,
      (snapshot) => {

        remindersDiv.innerHTML = "";


        const data =
          snapshot.val();


        if (!data) {

          remindersDiv.innerHTML =
            "<p>No reminders yet.</p>";

          return;
        }


        Object.entries(data)
          .forEach(([id, reminder]) => {

            if (reminder.uid !== uid) {
              return;
            }


            const div =
              document.createElement("div");

            div.className =
              "reminder";


            const reminderDate =
              new Date(
                reminder.timestamp
              );


            div.innerHTML = `

              <strong>
                ${escapeHtml(reminder.message)}
              </strong>

              <br>

              ${reminderDate.toLocaleString()}

              <br>

              Status:
              ${reminder.sent ? "Sent" : "Waiting"}

            `;


            remindersDiv.appendChild(div);

          });

      }
    );

  }


  // ==============================
  // SECURITY FOR DISPLAYED TEXT
  // ==============================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  // ==============================
  // FOREGROUND FCM MESSAGE
  // ==============================

  onMessage(
    messaging,
    (payload) => {

      console.log(
        "Foreground message:",
        payload
      );


      if (
        payload.notification
      ) {

        new Notification(
          payload.notification.title ||
          "NetVital Reminder",
          {
            body:
              payload.notification.body ||
              "You have a reminder."
          }
        );

      }

    }
  );

</script>

</body>
</html>
