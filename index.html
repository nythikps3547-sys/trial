<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #eef3ff;
}

.container {
    max-width: 700px;
    margin: auto;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    color: #3155d9;
}

h2 {
    margin-top: 5px;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    padding: 11px 16px;
    margin: 4px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

button:active {
    transform: scale(0.97);
}

.blue {
    background: #3155d9;
    color: white;
}

.red {
    background: #e53935;
    color: white;
}

.green {
    background: #2e7d32;
    color: white;
}

.center {
    text-align: center;
}

#motivation {
    background: #fff3cd;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
}


/* TIMER */

.timer {
    background: black;
    color: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
}

#time {
    font-size: 55px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.timer button {
    background: white;
    color: black;
}


/* TEACHER */

.teacher-box {
    background: #f5f0ff;
}


/* TASKS */

ul {
    padding: 0;
}

li {
    list-style: none;
    background: #f1f3f8;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
}

.task-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.task-info {
    flex: 1;
    cursor: pointer;
}

.subject {
    color: #3155d9;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
}

.completed {
    text-decoration: line-through;
    opacity: 0.5;
}

.empty {
    text-align: center;
    color: #777;
```
