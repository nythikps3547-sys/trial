<!DOCTYPE html>
<html>
<head>
    <title>Study To-Do</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        .box {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #3155d9;
        }

        #motivation {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        select,
        input {
            width: 90%;
            padding: 12px;
            margin: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        .add {
            background: #3155d9;
            color: white;
        }

        .delete {
            background: #ff5555;
            color: white;
        }

        li {
            list-style: none;
            background: #f1f3f8;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject {
            font-size: 13px;
            color: #3155d9;
            font-weight: bold;
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>📚 Study To-Do</h1>

    <div id="motivation">
        💪 You can do it!
    </div>

    <button onclick="newMotivation()">
        💡 Motivation
    </button>

    <hr>

    <h2>➕ Add Study Task</h2>

    <!-- SUBJECT LIST -->
    <select id="subject">

        <option value="">
            Select Subject
        </option>

        <option>📐 Mathematics</option>

        <option>⚡ Physics</option>

        <option>🧪 Chemistry</option>

        <option>🧬 Biology</option>

        <option>📖 English</option>

        <option>💻 Computer Science</option>

        <option>🌍 Social Science</option>

        <option>📝 Other</option>

    </select>

    <input
        type="text"
        id="taskInput"
        placeholder="Example: Complete chapter 3"
    >

    <button class="add" onclick="addTask()">
        Add Task
    </button>

    <h2>📋 My Tasks</h2>

    <ul id="taskList"></ul>

</div>

<script>

let tasks =
    JSON.parse(localStorage.getItem("studyTasks")) || [];


const motivationWords = [

    "💪 You can do it!",

    "📚 One page at a time.",

    "🔥 Keep going!",

    "🎯 Focus on your goal.",

    "⭐ Small progress is still progress.",

    "🧠 Learn today, succeed tomorrow.",

    "🚀 Don't give up!",

    "🏆 Your hard work will pay off.",

    "💡 Keep learning!",

    "🌟 Believe in yourself."

];


function showTasks() {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";

    tasks.forEach((task, index) => {

        const li =
            document.createElement("li");

        li.innerHTML = `

            <div class="task">

                <div>

                    <div class="subject">
                        ${task.subject}
                    </div>

                    <span
                        onclick="completeTask(${index})"
                        class="${task.completed
                            ? 'completed'
                            : ''}">

                        ${task.text}

                    </span>

                </div>

                <button
                    class="delete"
                    onclick="deleteTask(${index})">

                    Delete

                </button>

            </div>

        `;

        list.appendChild(li);

    });

}


function addTask() {

    const subject =
        document.getElementById("subject").value;

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    if (subject === "") {

        alert("Please select a subject.");

        return;
    }


    if (text === "") {

        alert("Please enter a task.");

        return;
    }


    tasks.push({

        subject: subject,

        text: text,

        completed: false

    });


    localStorage.setItem(
        "studyTasks",
        JSON.stringify(tasks)
    );


    input.value = "";

    document.getElementById("subject").value = "";


    showTasks();

}


function completeTask(index) {

    tasks[index].completed =
        !tasks[index].completed;


    localStorage.setItem(
        "studyTasks",
        JSON.stringify(tasks)
    );


    showTasks();

}


function deleteTask(index) {

    tasks.splice(index, 1);


    localStorage.setItem(
        "studyTasks",
        JSON.stringify(tasks)
    );


    showTasks();

}


function newMotivation() {

    const random =
        Math.floor(
            Math.random() *
            motivationWords.length
        );


    document.getElementById(
        "motivation"
    ).innerText =
        motivationWords[random];

}


showTasks();

</script>

</body>
</html>
