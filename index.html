<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NetVital Timer</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #000;

  color: white;

}


/* LOGIN */

#loginScreen {

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  background: #000;

}

.loginBox {

  width: 90%;

  max-width: 420px;

  background: #111;

  padding: 35px;

  border-radius: 20px;

  border: 1px solid #333;

  text-align: center;

}

.loginBox h1 {

  font-size: 40px;

}

input {

  width: 100%;

  padding: 16px;

  margin-top: 12px;

  background: #1c1c1c;

  color: white;

  border: 1px solid #444;

  border-radius: 10px;

  font-size: 18px;

}

button {

  width: 100%;

  padding: 16px;

  margin-top: 12px;

  border: none;

  border-radius: 10px;

  background: #333;

  color: white;

  font-size: 18px;

  cursor: pointer;

}

button:hover {

  background: #555;

}


/* MAIN */

#mainScreen {

  display: none;

  min-height: 100vh;

  padding: 20px;

  background: #000;

}

.header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 20px;

}

.header h1 {

  margin: 0;

}


/* LARGE TIMER */

.timerArea {

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(320px, 1fr));

  gap: 20px;

}


/* TIMER CARD */

.timer {

  background: #111;

  border: 1px solid #333;

  border-radius: 25px;

  padding: 35px;

  min-height: 430px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  text-align: center;

}

.timerMessage {

  font-size: 28px;

  font-weight: bold;

  margin-bottom: 25px;

  word-break: break-word;

}

.countdown {

  font-size: clamp(60px, 12vw, 120px);

  font-weight: bold;

  letter-spacing: 5px;

  margin: 20px 0;

}

.timerInfo {

  color: #aaa;

  font-size: 16px;

}

.deleteBtn {

  background: #8b0000;

}

.deleteBtn:hover {

  background: #b00000;

}


/* ADD TIMER */

.addTimer {

  background: #151515;

  border: 1px solid #333;

  border-radius: 20px;

  padding: 25px;

  margin-bottom: 25px;

}

.addTimer h2 {

  margin-top: 0;

}

.addBtn {

  background: #fff;

  color: #000;

  font-weight: bold;

}

.status {

  text-align: center;

  color: #aaa;

  margin: 15px;

}

.logout {

  width: auto;

  padding: 10px 20px;

  background: #333;

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="loginBox">

    <h1>NetVital</h1>

    <p>Timer System</p>

    <input
      id="username"
      type="text"
      placeholder="Username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <p id="loginError"></p>

  </div>

</div>



<!-- =========================
     MAIN
========================= -->

<div id="mainScreen">


  <div class="header">

    <h1>NetVital</h1>

    <button
      class="logout"
      onclick="logout()">

      Logout

    </button>

  </div>


  <!-- ADD TIMER -->

  <div class="addTimer">

    <h2>➕ Add Timer</h2>

    <input
      id="message"
      type="text"
      placeholder="Message"
    >

    <input
      id="hours"
      type="number"
      min="0"
      placeholder="Hours"
    >

    <input
      id="minutes"
      type="number"
      min="0"
      placeholder="Minutes"
    >

    <input
      id="seconds"
      type="number"
      min="0"
      placeholder="Seconds"
    >

    <button
      class="addBtn"
      onclick="addTimer()">

      ➕ ADD TIMER

    </button>

  </div>


  <div
    id="status"
    class="status">

    Connected

  </div>


  <!-- TIMERS -->

  <div
    id="timerArea"
    class="timerArea">

  </div>


</div>



<script type="module">


/* ==================================
   FIREBASE
================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  remove
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* ==================================
   FIREBASE CONFIG
================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyAEle7t2uxecqThWzbjV5RX8wEcXqnJvZM",

  authDomain:
  "netvital-ca1d1.firebaseapp.com",

  databaseURL:
  "https://netvital-ca1d1-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "netvital-ca1d1",

  storageBucket:
  "netvital-ca1d1.firebasestorage.app",

  messagingSenderId:
  "199895359034",

  appId:
  "1:199895359034:web:c997ee869b549578615f03"

};


const app =
initializeApp(firebaseConfig);


const database =
getDatabase(app);



/* ==================================
   LOGIN DETAILS
================================== */

const CORRECT_USERNAME =
"trial";

const CORRECT_PASSWORD =
"12345";


/* ==================================
   LOGIN
================================== */

window.login = function() {

  const username =
    document
      .getElementById("username")
      .value;

  const password =
    document
      .getElementById("password")
      .value;


  if (
    username === CORRECT_USERNAME &&
    password === CORRECT_PASSWORD
  ) {

    sessionStorage.setItem(
      "netvitalLogin",
      "true"
    );


    document
      .getElementById("loginScreen")
      .style.display = "none";


    document
      .getElementById("mainScreen")
      .style.display = "block";


    requestNotificationPermission();

  }

  else {

    document
      .getElementById("loginError")
      .innerText =
      "Wrong username or password.";

  }

};


/* ==================================
   LOGOUT
================================== */

window.logout = function() {

  sessionStorage.removeItem(
    "netvitalLogin"
  );

  location.reload();

};


/* ==================================
   CHECK LOGIN
================================== */

if (
  sessionStorage.getItem(
    "netvitalLogin"
  ) === "true"
) {

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("mainScreen")
    .style.display = "block";

  requestNotificationPermission();

}



/* ==================================
   NOTIFICATIONS
================================== */

async function
requestNotificationPermission() {

  if (
    "Notification" in window
  ) {

    if (
      Notification.permission !==
      "granted"
    ) {

      await Notification.requestPermission();

    }

  }

}



/* ==================================
   ADD TIMER
================================== */

window.addTimer = async function() {

  const message =
    document
      .getElementById("message")
      .value
      .trim();


  const hours =
    Number(
      document
        .getElementById("hours")
        .value || 0
    );


  const minutes =
    Number(
      document
        .getElementById("minutes")
        .value || 0
    );


  const seconds =
    Number(
      document
        .getElementById("seconds")
        .value || 0
    );


  if (!message) {

    alert(
      "Enter a message."
    );

    return;

  }


  const totalMilliseconds =

    (
      hours * 60 * 60 * 1000
    )

    +

    (
      minutes * 60 * 1000
    )

    +

    (
      seconds * 1000
    );


  if (
    totalMilliseconds <= 0
  ) {

    alert(
      "Set a timer."
    );

    return;

  }


  /*
    IMPORTANT:

    Store the exact finish time.

    Every connected device receives
    this same finish time from Firebase.
  */

  const finishTime =
    Date.now() +
    totalMilliseconds;


  const timerRef =
    push(
      ref(
        database,
        "timers"
      )
    );


  await set(
    timerRef,
    {

      message:
        message,

      finishTime:
        finishTime,

      createdAt:
        Date.now(),

      finished:
        false

    }
  );


  document
    .getElementById("message")
    .value = "";

  document
    .getElementById("hours")
    .value = "";

  document
    .getElementById("minutes")
    .value = "";

  document
    .getElementById("seconds")
    .value = "";


  document
    .getElementById("status")
    .innerText =
    "Timer added to all connected devices.";

};



/* ==================================
   RECEIVE TIMERS FROM FIREBASE
================================== */

const timersRef =
ref(
  database,
  "timers"
);


onValue(
  timersRef,
  function(snapshot) {

    const data =
      snapshot.val();


    const area =
      document
        .getElementById("timerArea");


    area.innerHTML = "";


    if (!data) {

      area.innerHTML =
        "<p class='status'>No timers</p>";

      return;

    }


    Object.entries(data)
      .forEach(
        function([id, timer]) {

          createTimerCard(
            id,
            timer
          );

        }
      );

  }
);



/* ==================================
   CREATE TIMER CARD
================================== */

function
createTimerCard(
  id,
  timer
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "timer";


  card.id =
    "timer-" + id;


  card.innerHTML = `

    <div class="timerMessage">
      ${escapeHTML(timer.message)}
    </div>

    <div
      class="countdown"
      id="countdown-${id}">

      00:00:00

    </div>

    <div class="timerInfo">
      Shared with connected devices
    </div>

    <button
      class="deleteBtn"
      onclick="deleteTimer('${id}')">

      Delete Timer

    </button>

  `;


  document
    .getElementById("timerArea")
    .appendChild(card);


  updateTimer(
    id,
    timer
  );

}



/* ==================================
   UPDATE TIMER
================================== */

function
updateTimer(
  id,
  timer
) {

  const interval =
    setInterval(
      function() {

        const remaining =
          timer.finishTime -
          Date.now();


        const display =
          document
            .getElementById(
              "countdown-" + id
            );


        if (!display) {

          clearInterval(
            interval
          );

          return;

        }


        if (
          remaining <= 0
        ) {

          display.innerText =
            "00:00:00";


          clearInterval(
            interval
          );


          /*
            Only the device that detects
            the timer finishing shows its
            notification.

            Since every connected device
            has the same finishTime,
            all connected devices detect
            it at approximately the
            same time.
          */

          showNotification(
            timer.message
          );


          return;

        }


        const totalSeconds =
          Math.floor(
            remaining / 1000
          );


        const hours =
          Math.floor(
            totalSeconds / 3600
          );


        const minutes =
          Math.floor(
            (totalSeconds % 3600) / 60
          );


        const seconds =
          totalSeconds % 60;


        display.innerText =

          String(hours)
            .padStart(2, "0")

          + ":" +

          String(minutes)
            .padStart(2, "0")

          + ":" +

          String(seconds)
            .padStart(2, "0");


      },

      1000
    );

}



/* ==================================
   NOTIFICATION
================================== */

function
showNotification(message) {

  if (
    Notification.permission ===
    "granted"
  ) {

    new Notification(
      "NetVital",
      {
        body: message
      }
    );

  }

}



/* ==================================
   DELETE TIMER
================================== */

window.deleteTimer =
async function(id) {

  await remove(
    ref(
      database,
      "timers/" + id
    )
  );

};



/* ==================================
   SECURITY FOR MESSAGE
================================== */

function
escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}

</script>

</body>
</html>
