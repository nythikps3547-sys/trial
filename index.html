<body>

<div class="container">

    <h1>📚 Study Dashboard</h1>

    <div class="card">

            💪 You can do it!

            </button>

        </div>

        </select>

        <button
            class="blue"

<script>

/* =========================
   MOTIVATION
========================= */

const motivationWords = [

    "💪 You can do it!",

    "📚 One page at a time.",

    "🔥 Keep going!",

    "🎯 Focus on your goal.",

    "⭐ Small progress is still progress.",

    "🧠 Learn today, succeed tomorrow.",

    "🚀 Don't give up!",

    "🏆 Your hard work will pay off.",

    "💡 Keep learning!",

    "🌟 Believe in yourself."

];


function newMotivation() {

    const random =
        Math.floor(
            Math.random() *
            motivationWords.length
        );

    document.getElementById(
        "motivation"
    ).innerText =
        motivationWords[random];

}


/* =========================
   STUDY TIMER
========================= */

let totalSeconds = 25 * 60;

let timer = null;


function updateTimer() {

    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds % 60;

    document.getElementById("time")
        .innerText =
        String(minutes).padStart(2, "0")
        + ":" +
        String(seconds).padStart(2, "0");

}


function startTimer() {

    if (timer !== null) {
        return;
    }

    timer = setInterval(function() {

        if (totalSeconds > 0) {

            totalSeconds--;

            updateTimer();

        } else {

            clearInterval(timer);

            timer = null;

            alert("🎉 Study session complete!");

        }

    }, 1000);

}


function pauseTimer() {

    clearInterval(timer);

    timer = null;

}


function resetTimer() {

    clearInterval(timer);

    timer = null;

    totalSeconds = 25 * 60;

    updateTimer();

}


updateTimer();


/* =========================
   /TEACHER
========================= */

function askTeacher() {

    const topic =
        document.getElementById(
            "topicInput"
        ).value.trim();


    if (topic === "") {

        alert("Enter a topic first.");

        return;

    }


    const prompt =
        "/teacher Explain " +
        topic +
        " in a simple beginner-friendly way with examples.";


    const url =
        "https://chatgpt.com/?q=" +
        encodeURIComponent(prompt);


    window.open(url, "_blank");

}


/* =========================
   TASK SYSTEM
========================= */

let tasks =
    JSON.parse(
        localStorage.getItem("studyTasks")
    ) || [];


function saveTasks() {

    localStorage.setItem(
        "studyTasks",
        JSON.stringify(tasks)
    );

}


function showTasks() {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";


    if (tasks.length === 0) {

        list.innerHTML =
            '<p class="empty">No tasks yet 📚</p>';

        return;

    }


    tasks.forEach(function(task, index) {

        const li =
            document.createElement("li");


        li.innerHTML = `

            <div class="task-row">

                <div>

                    <div class="subject">
                        ${escapeHTML(task.subject)}
                    </div>

                    <span
                        onclick="completeTask(${index})"
                        class="${task.completed
                            ? "completed"
                            : ""}">

                        ${escapeHTML(task.text)}

                    </span>

                </div>

                <button
                    class="red"
                    onclick="deleteTask(${index})">

                    Delete

                </button>

            </div>

        `;


        list.appendChild(li);

    });

}


function addTask() {

    const subject =
        document.getElementById(
            "subject"
        ).value;


    const input =
        document.getElementById(
            "taskInput"
        );


    const text =
        input.value.trim();


    if (subject === "") {

        alert("Please select a subject.");

        return;

    }


    if (text === "") {

        alert("Please enter a task.");

        return;

    }


    tasks.push({

        subject: subject,

        text: text,

        completed: false

    });
