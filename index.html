<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NetVital Timer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #aaa;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #aaa;
    }

    button {
      border: none;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #125aa0;
    }

    .timer {
      background: #eeeeee;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
    }

    .time {
      font-size: 25px;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
    }

    .delete {
      background: #d32f2f;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>NetVital</h1>

  <button id="addTimer">
    ➕ Add Timer
  </button>

  <div id="timerArea"></div>

</div>


<script>

let timerNumber = 0;


/* =========================
   NOTIFICATION PERMISSION
========================= */

async function enableNotifications() {

  if (!("Notification" in window)) {

    alert(
      "Your browser does not support notifications."
    );

    return false;
  }

  if (Notification.permission === "granted") {
    return true;
  }

  const permission =
    await Notification.requestPermission();

  if (permission !== "granted") {

    alert(
      "Please allow notifications."
    );

    return false;
  }

  return true;
}


/* =========================
   ADD TIMER BUTTON
========================= */

document
  .getElementById("addTimer")
  .addEventListener("click", async function() {

    const allowed =
      await enableNotifications();

    if (!allowed) {
      return;
    }

    timerNumber++;

    createTimer(timerNumber);

  });


/* =========================
   CREATE TIMER
========================= */

function createTimer(id) {

  const timer =
    document.createElement("div");

  timer.className = "timer";

  timer.id =
    "timer-" + id;


  timer.innerHTML = `

    <h3>Timer ${id}</h3>

    <input
      type="text"
      id="message-${id}"
      placeholder="Enter message"
    >

    <label>
      Hours
    </label>

    <input
      type="number"
      id="hours-${id}"
      min="0"
      value="0"
    >

    <label>
      Minutes
    </label>

    <input
      type="number"
      id="minutes-${id}"
      min="0"
      value="1"
    >

    <label>
      Seconds
    </label>

    <input
      type="number"
      id="seconds-${id}"
      min="0"
      value="0"
    >

    <button onclick="startTimer(${id})">
      ▶ Start Timer
    </button>

    <button
      class="delete"
      onclick="deleteTimer(${id})"
    >
      🗑 Delete
    </button>

    <div
      class="time"
      id="display-${id}"
    >
      Not started
    </div>

  `;


  document
    .getElementById("timerArea")
    .appendChild(timer);
}


/* =========================
   START TIMER
========================= */

function startTimer(id) {

  const message =
    document
      .getElementById("message-" + id)
      .value
      .trim();


  const hours =
    Number(
      document
        .getElementById("hours-" + id)
        .value
    );


  const minutes =
    Number(
      document
        .getElementById("minutes-" + id)
        .value
    );


  const seconds =
    Number(
      document
        .getElementById("seconds-" + id)
        .value
    );


  if (!message) {

    alert(
      "Enter a message."
    );

    return;
  }


  const totalSeconds =
    (hours * 3600) +
    (minutes * 60) +
    seconds;


  if (totalSeconds <= 0) {

    alert(
      "Set a timer greater than 0."
    );

    return;
  }


  let remaining =
    totalSeconds;


  const display =
    document
      .getElementById(
        "display-" + id
      );


  displayTime(
    display,
    remaining
  );


  const interval =
    setInterval(function() {

      remaining--;

      displayTime(
        display,
        remaining
      );


      if (remaining <= 0) {

        clearInterval(interval);

        timerFinished(
          message
        );

      }

    }, 1000);


  display.dataset.running =
    "true";
}


/* =========================
   DISPLAY TIME
========================= */

function displayTime(
  element,
  totalSeconds
) {

  const hours =
    Math.floor(
      totalSeconds / 3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );


  const seconds =
    totalSeconds % 60;


  element.innerText =

    String(hours).padStart(2, "0") +
    ":" +

    String(minutes).padStart(2, "0") +
    ":" +

    String(seconds).padStart(2, "0");
}


/* =========================
   TIMER FINISHED
========================= */

function timerFinished(message) {

  /*
    System/browser notification
  */

  if (
    Notification.permission ===
    "granted"
  ) {

    new Notification(
      "NetVital",
      {
        body: message,
        icon: "./icon.png"
      }
    );

  }


  /*
    Also show an alert if the
    page is currently open.
  */

  alert(
    "NetVital\n\n" +
    message
  );

}


/* =========================
   DELETE TIMER
========================= */

function deleteTimer(id) {

  const timer =
    document.getElementById(
      "timer-" + id
    );


  if (timer) {

    timer.remove();

  }

}

</script>

</body>
</html>
