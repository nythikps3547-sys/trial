<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NetVital Timer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.loginBox {
    width: 90%;
    max-width: 420px;
    background: #111;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
}

.loginBox h1 {
    font-size: 40px;
}

input {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #1b1b1b;
    color: white;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 17px;
}

button:active {
    transform: scale(0.98);
}

/* MAIN */

#mainScreen {
    display: none;
    min-height: 100vh;
    padding: 15px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout {
    width: auto;
    padding: 10px 20px;
}

/* ADD */

.addBox {
    background: #111;
    padding: 20px;
    border-radius: 20px;
    margin-top: 15px;
}

.addButton {
    background: white;
    color: black;
    font-weight: bold;
}

/* TIMER */

#timerArea {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.timerCard {
    background: #111;
    border: 1px solid #333;
    border-radius: 25px;
    padding: 30px;
    text-align: center;
}

.message {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
    overflow-wrap: anywhere;
}

.countdown {
    font-size: clamp(55px, 13vw, 120px);
    font-weight: bold;
    letter-spacing: 4px;
}

.deviceText {
    color: #888;
    margin-top: 15px;
}

.status {
    text-align: center;
    color: #aaa;
    margin-top: 15px;
}

.deleteButton {
    background: #800000;
}

</style>
</head>


<body>


<!-- LOGIN -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>NetVital</h1>

        <p>Timer System</p>

        <input
            id="username"
            type="text"
            placeholder="Username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="loginButton">
            LOGIN
        </button>

        <p id="loginError"></p>

    </div>

</div>


<!-- MAIN -->

<div id="mainScreen">

    <div class="header">

        <h1>NetVital</h1>

        <button
            class="logout"
            id="logoutButton">
            Logout
        </button>

    </div>


    <!-- ADD TIMER -->

    <div class="addBox">

        <h2>➕ Add Timer</h2>

        <input
            id="messageInput"
            type="text"
            placeholder="Enter message"
        >

        <input
            id="hoursInput"
            type="number"
            min="0"
            value="0"
            placeholder="Hours"
        >

        <input
            id="minutesInput"
            type="number"
            min="0"
            value="0"
            placeholder="Minutes"
        >

        <input
            id="secondsInput"
            type="number"
            min="0"
            value="10"
            placeholder="Seconds"
        >

        <button
            class="addButton"
            id="addButton">
            ➕ ADD TIMER
        </button>

    </div>


    <div
        class="status"
        id="status">
        Connected
    </div>


    <div id="timerArea"></div>

</div>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyAEle7t2uxecqThWzbjV5RX8wEcXqnJvZM",

    authDomain:
    "netvital-ca1d1.firebaseapp.com",

    databaseURL:
    "https://netvital-ca1d1-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "netvital-ca1d1",

    storageBucket:
    "netvital-ca1d1.firebasestorage.app",

    messagingSenderId:
    "199895359034",

    appId:
    "1:199895359034:web:c997ee869b549578615f03"
};


const app =
initializeApp(firebaseConfig);


const database =
getDatabase(app);


/* =========================================
   LOGIN
========================================= */

const USERNAME = "trial";

const PASSWORD = "12345";


const loginScreen =
document.getElementById(
    "loginScreen"
);

const mainScreen =
document.getElementById(
    "mainScreen"
);


document
.getElementById("loginButton")
.addEventListener(
    "click",
    login
);


function login() {

    const username =
    document
    .getElementById("username")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value;


    if (
        username === USERNAME &&
        password === PASSWORD
    ) {

        loginScreen.style.display =
            "none";

        mainScreen.style.display =
            "block";


        startNotifications();

    }

    else {

        document
        .getElementById("loginError")
        .innerText =
        "Wrong username or password.";

    }
}


/* =========================================
   LOGOUT
========================================= */

document
.getElementById("logoutButton")
.addEventListener(
    "click",
    function() {

        location.reload();

    }
);


/* =========================================
   NOTIFICATIONS
========================================= */

async function startNotifications() {

    if (
        !("Notification" in window)
    ) {

        document
        .getElementById("status")
        .innerText =
        "Notifications are not supported.";

        return;

    }


    if (
        Notification.permission ===
        "default"
    ) {

        const permission =
        await Notification.requestPermission();


        if (
            permission === "granted"
        ) {

            document
            .getElementById("status")
            .innerText =
            "🔔 Notifications enabled";

        }

        else {

            document
            .getElementById("status")
            .innerText =
            "⚠️ Allow notifications.";

        }

    }

    else if (
        Notification.permission ===
        "granted"
    ) {

        document
        .getElementById("status")
        .innerText =
        "🔔 Notifications enabled";

    }

}


/* =========================================
   ADD TIMER
========================================= */

document
.getElementById("addButton")
.addEventListener(
    "click",
    addTimer
);


async function addTimer() {

    const message =
    document
    .getElementById("messageInput")
    .value
    .trim();


    const hours =
    Number(
        document
        .getElementById("hoursInput")
        .value || 0
    );


    const minutes =
    Number(
        document
        .getElementById("minutesInput")
        .value || 0
    );


    const seconds =
    Number(
        document
        .getElementById("secondsInput")
        .value || 0
    );


    if (!message) {

        alert(
            "Enter a message."
        );

        return;

    }


    const totalMilliseconds =

        hours * 60 * 60 * 1000

        +

        minutes * 60 * 1000

        +

        seconds * 1000;


    if (
        totalMilliseconds <= 0
    ) {

        alert(
            "Set a timer greater than 0."
        );

        return;

    }


    /*
       IMPORTANT:

       Save the exact finish time
       to Firebase.

       Every connected device gets
       this same finish time.
    */

    const finishTime =
        Date.now() +
        totalMilliseconds;


    const newTimer =
        push(
            ref(
                database,
                "timers"
            )
        );


    await set(
        newTimer,
        {

            message:
                message,

            finishTime:
                finishTime,

            createdAt:
                Date.now()

        }
    );


    document
    .getElementById("messageInput")
    .value = "";

}


/* =========================================
   RECEIVE TIMERS
========================================= */

const timersRef =
ref(
    database,
    "timers"
);


onValue(
    timersRef,
    function(snapshot) {

        const data =
            snapshot.val();


        const area =
            document
            .getElementById(
                "timerArea"
            );


        area.innerHTML = "";


        if (!data) {

            return;

        }


        Object.entries(data)
        .forEach(
            function([id, timer]) {

                createTimer(
                    id,
                    timer
                );

            }
        );

    }
);


/* =========================================
   ACTIVE TIMERS

   Prevent duplicate countdowns
========================================= */

const activeTimers =
new Set();


/* =========================================
   CREATE TIMER
========================================= */

function createTimer(
    id,
    timer
) {

    const area =
        document
        .getElementById(
            "timerArea"
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "timerCard";


    card.id =
        "card-" + id;


    card.innerHTML = `

        <div class="message">
            ${escapeHTML(timer.message)}
        </div>

        <div
            class="countdown"
            id="countdown-${id}">
            00:00:00
        </div>

        <div class="deviceText">
            Synced with connected devices
        </div>

        <button
            class="deleteButton"
            data-id="${id}">
            Delete
        </button>

    `;


    area.appendChild(card);


    card
    .querySelector(".deleteButton")
    .addEventListener(
        "click",
        function() {

            /*
               Only removes this timer
               from this device's screen.
            */

            card.remove();

        }
    );


    if (
        !activeTimers.has(id)
    ) {

        activeTimers.add(id);

        runTimer(
            id,
            timer
        );

    }

}


/* =========================================
   RUN TIMER
========================================= */

function runTimer(
    id,
    timer
) {

    const interval =
    setInterval(
        function() {

            const remaining =
                timer.finishTime -
                Date.now();


            const display =
            document
            .getElementById(
                "countdown-" + id
            );


            if (!display) {

                clearInterval(
                    interval
                );

                activeTimers.delete(id);

                return;

            }


            if (
                remaining <= 0
            ) {

                clearInterval(
                    interval
                );

                activeTimers.delete(id);


                display.innerText =
                    "00:00:00";


                /*
                   SHOW THE MESSAGE
                */

                showMessage(
                    timer.message
                );


                /*
                   REMOVE COMPLETED TIMER
                   FROM THIS DEVICE
                */

                setTimeout(
                    function() {

                        const card =
                        document
                        .getElementById(
                            "card-" + id
                        );


                        if (card) {

                            card.remove();

                        }

                    },
                    1500
                );


                return;

            }


            const totalSeconds =
                Math.floor(
                    remaining / 1000
                );


            const hours =
                Math.floor(
                    totalSeconds / 3600
                );


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) /
                    60
                );


            const seconds =
                totalSeconds % 60;


            display.innerText =

                String(hours)
                .padStart(2, "0")

                + ":" +

                String(minutes)
                .padStart(2, "0")

                + ":" +

                String(seconds)
                .padStart(2, "0");


        },
        1000
    );

}


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(message) {

    /*
       Browser/system notification
    */

    if (
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            "NetVital",
            {
                body: message,
                requireInteraction: true
            }
        );

    }


    /*
       Also show an alert while
       the website is open.
    */

    alert(
        "NetVital\n\n" +
        message
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}

</script>

</body>
</html>
