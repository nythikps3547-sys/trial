<!DOCTYPE html>
<html>
<head>
  <title>NetVital Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;

    button {
      width: 98%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
